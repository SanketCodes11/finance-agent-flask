{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card bg-body border-0 shadow-lg mt-5 premium-card rounded-4">
            <div class="card-header bg-transparent border-0 text-center pt-5 pb-2">
                <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                    <i class="fa-solid fa-chart-line fa-2x"></i>
                </div>
                <h3 class="fw-bold tracking-tight mb-1">Welcome Back</h3>
                <p class="text-muted mb-0 small">Login to your account</p>
            </div>
            <div class="card-body p-4 p-sm-5 pt-3">
                <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3 position-relative">
                        <label for="username" class="form-label text-muted fw-medium small">Username</label>
                        <input type="text" class="form-control form-control-lg bg-body-tertiary border-0 rounded-3 px-3 py-2" id="username" name="username" required autofocus autocomplete="username">
                        <div class="invalid-feedback">Please enter your username.</div>
                    </div>
                    
                    <div class="mb-4 position-relative">
                        <label for="password" class="form-label text-muted fw-medium small">Password</label>
                        <input type="password" class="form-control form-control-lg bg-body-tertiary border-0 rounded-3 px-3 py-2" id="password" name="password" required autocomplete="current-password">
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>
                    
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                        <label class="form-check-label text-muted small" for="remember_me">Remember Me</label>
                    </div>
                    
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold shadow-sm" id="submitBtn">
                            <span class="spinner-border spinner-border-sm d-none me-2" id="submitSpinner" role="status" aria-hidden="true"></span>
                            <span id="submitText">Login</span>
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-transparent border-top border-opacity-10 text-center py-4">
                <p class="mb-0 text-muted small fw-medium">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none ms-1">Sign Up</a></p>
            </div>
        </div>
        <div class="text-center mt-3 small opacity-50">
            <a href="{{ url_for('admin.login') }}" class="text-muted text-decoration-none"><i class="fa-solid fa-shield-halved me-1"></i>Admin Portal</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('loginForm');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const submitSpinner = document.getElementById('submitSpinner');
    const submitText = document.getElementById('submitText');

    username.addEventListener('input', function() {
        this.classList.remove('is-invalid');
    });

    password.addEventListener('input', function() {
        this.classList.remove('is-invalid');
    });

    form.addEventListener('submit', function(event) {
        let isValid = true;
        
        if (!username.value.trim()) {
            username.classList.add('is-invalid');
            isValid = false;
        }
        if (!password.value) {
            password.classList.add('is-invalid');
            isValid = false;
        }

        if (!isValid) {
            event.preventDefault();
            event.stopPropagation();
        } else {
            submitBtn.disabled = true;
            submitSpinner.classList.remove('d-none');
            submitText.textContent = 'Authenticating...';
        }
    });
});
</script>
{% endblock %}
