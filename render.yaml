services:
  - type: web
    name: finance-insight-agent
    env: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: NEWS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: finance-db
    databaseName: finance
    user: finance_user
